apiVersion: apps/v1
kind: Deployment
metadata:
  name: eruun-console
  labels:
    app: eruun-console
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eruun-console
  template:
    metadata:
      labels:
        app: eruun-console
    spec:
      containers:
      - name: eruun-console
        image: docker.yu3.co/3os/eruun-cli:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: eruun-console-svc
spec:
  selector:
    app: eruun-console
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eruun-console-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: eruun-console.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: eruun-console-svc
            port:
              number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: eruun-api-svc # Replace with your actual Backend Service name
                port:
                  number: 8080
